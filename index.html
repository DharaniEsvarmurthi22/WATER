<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Dashboard - Real-time Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'water-blue': '#0ea5e9',
                        'water-cyan': '#06b6d4',
                        'water-teal': '#0d9488'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 overflow-hidden">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 relative z-50">
        <div class="px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo and Title -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-water-blue to-water-cyan rounded-lg flex items-center justify-center">
                        <i class="fas fa-tint text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900">Water Dashboard</h1>
                        <p class="text-xs text-gray-500">Real-time Monitoring</p>
                    </div>
                </div>

                <!-- Status Indicator -->
                <div class="flex items-center space-x-4">
                    <div id="connectionStatus" class="flex items-center space-x-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-sm text-gray-600">Connected</span>
                    </div>
                    
                    <!-- User Info -->
                    <div id="userInfo" class="hidden sm:block"></div>
                    
                    <!-- Logout Button -->
                    <button 
                        id="logoutButton"
                        class="flex items-center space-x-2 px-3 py-2 text-sm text-gray-600 hover:text-gray-900 transition-colors"
                    >
                        <i class="fas fa-sign-out-alt"></i>
                        <span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex h-screen pt-16">
        <!-- Sidebar Controls -->
        <div class="w-80 bg-white shadow-lg border-r border-gray-200 flex flex-col relative z-40">
            <!-- Controls Header -->
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900 mb-2">Map Controls</h2>
                
                <!-- Map Style Toggle -->
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Map Style</label>
                        <div class="flex bg-gray-100 rounded-lg p-1">
                            <button 
                                id="streetViewBtn" 
                                class="flex-1 px-3 py-2 text-sm font-medium rounded-md transition-colors bg-white text-water-blue shadow-sm"
                            >
                                <i class="fas fa-road mr-2"></i>Street
                            </button>
                            <button 
                                id="satelliteViewBtn" 
                                class="flex-1 px-3 py-2 text-sm font-medium rounded-md transition-colors text-gray-600 hover:text-gray-900"
                            >
                                <i class="fas fa-satellite mr-2"></i>Satellite
                            </button>
                        </div>
                    </div>

                    <!-- Layer Controls -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Data Layers</label>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="checkbox" id="sensorsLayer" checked class="rounded border-gray-300 text-water-blue focus:ring-water-blue">
                                <span class="ml-2 text-sm text-gray-700">Sensor Locations</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" id="heatmapLayer" class="rounded border-gray-300 text-water-blue focus:ring-water-blue">
                                <span class="ml-2 text-sm text-gray-700">Data Heatmap</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" id="overlaysLayer" class="rounded border-gray-300 text-water-blue focus:ring-water-blue">
                                <span class="ml-2 text-sm text-gray-700">Custom Overlays</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- File Upload Section -->
            <div class="p-4 border-b border-gray-200">
                <h3 class="text-sm font-medium text-gray-700 mb-3">Upload Overlays</h3>
                <div class="space-y-3">
                    <div>
                        <label for="fileUpload" class="block text-xs text-gray-600 mb-1">KML/GeoJSON Files</label>
                        <input 
                            type="file" 
                            id="fileUpload" 
                            accept=".kml,.geojson,.json" 
                            multiple
                            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-water-blue file:text-white hover:file:bg-water-cyan"
                        >
                    </div>
                    <div>
                        <label for="urlInput" class="block text-xs text-gray-600 mb-1">External URL</label>
                        <div class="flex">
                            <input 
                                type="url" 
                                id="urlInput" 
                                placeholder="https://example.com/data.geojson"
                                class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-water-blue focus:border-transparent"
                            >
                            <button 
                                id="loadUrlBtn"
                                class="px-3 py-2 bg-water-blue text-white text-sm rounded-r-lg hover:bg-water-cyan transition-colors"
                            >
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Data Filters -->
            <div class="p-4 border-b border-gray-200">
                <h3 class="text-sm font-medium text-gray-700 mb-3">Data Filters</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Value Range</label>
                        <div class="flex space-x-2">
                            <input 
                                type="number" 
                                id="minValue" 
                                placeholder="Min"
                                class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-water-blue"
                            >
                            <input 
                                type="number" 
                                id="maxValue" 
                                placeholder="Max"
                                class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-water-blue"
                            >
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Time Range</label>
                        <select id="timeRange" class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-water-blue">
                            <option value="1h">Last Hour</option>
                            <option value="6h">Last 6 Hours</option>
                            <option value="24h" selected>Last 24 Hours</option>
                            <option value="7d">Last 7 Days</option>
                            <option value="30d">Last 30 Days</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Statistics Panel -->
            <div class="flex-1 p-4 overflow-y-auto">
                <h3 class="text-sm font-medium text-gray-700 mb-3">Live Statistics</h3>
                <div id="statsContainer" class="space-y-3">
                    <div class="bg-gradient-to-r from-water-blue to-water-cyan rounded-lg p-3 text-white">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs opacity-90">Active Sensors</p>
                                <p id="activeSensors" class="text-lg font-bold">--</p>
                            </div>
                            <i class="fas fa-broadcast-tower text-xl opacity-80"></i>
                        </div>
                    </div>
                    
                    <div class="bg-gradient-to-r from-green-500 to-emerald-500 rounded-lg p-3 text-white">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs opacity-90">Avg Reading</p>
                                <p id="avgReading" class="text-lg font-bold">--</p>
                            </div>
                            <i class="fas fa-chart-bar text-xl opacity-80"></i>
                        </div>
                    </div>
                    
                    <div class="bg-gradient-to-r from-orange-500 to-red-500 rounded-lg p-3 text-white">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs opacity-90">Last Update</p>
                                <p id="lastUpdate" class="text-xs font-medium">--</p>
                            </div>
                            <i class="fas fa-clock text-xl opacity-80"></i>
                        </div>
                    </div>
                </div>

                <!-- Recent Readings -->
                <div class="mt-6">
                    <h4 class="text-sm font-medium text-gray-700 mb-2">Recent Readings</h4>
                    <div id="recentReadings" class="space-y-2 max-h-40 overflow-y-auto">
                        <!-- Dynamic content -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Map Container -->
        <div class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>
            
            <!-- Map Loading Overlay -->
            <div id="mapLoading" class="absolute inset-0 bg-white bg-opacity-90 flex items-center justify-center z-30">
                <div class="text-center">
                    <div class="w-12 h-12 border-4 border-water-blue border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-gray-600">Loading map...</p>
                </div>
            </div>

            <!-- Map Controls -->
            <div class="absolute top-4 right-4 space-y-2 z-20">
                <button 
                    id="fullscreenBtn"
                    class="w-10 h-10 bg-white rounded-lg shadow-lg flex items-center justify-center text-gray-600 hover:text-gray-900 transition-colors"
                    title="Toggle Fullscreen"
                >
                    <i class="fas fa-expand"></i>
                </button>
                <button 
                    id="locateBtn"
                    class="w-10 h-10 bg-white rounded-lg shadow-lg flex items-center justify-center text-gray-600 hover:text-gray-900 transition-colors"
                    title="Find My Location"
                >
                    <i class="fas fa-crosshairs"></i>
                </button>
                <button 
                    id="refreshBtn"
                    class="w-10 h-10 bg-white rounded-lg shadow-lg flex items-center justify-center text-gray-600 hover:text-gray-900 transition-colors"
                    title="Refresh Data"
                >
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>

            <!-- Zoom Level Indicator -->
            <div class="absolute bottom-4 right-4 bg-black bg-opacity-50 text-white px-2 py-1 rounded text-xs z-20">
                Zoom: <span id="zoomLevel">4</span>
            </div>
        </div>
    </div>

    <!-- Popup Template (Hidden) -->
    <div id="popupTemplate" class="hidden">
        <div class="p-3 min-w-64">
            <div class="flex items-center justify-between mb-2">
                <h3 class="font-semibold text-gray-900">Sensor Location</h3>
                <button class="text-gray-400 hover:text-gray-600" onclick="closePopup()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between">
                    <span class="text-gray-600">Current Value:</span>
                    <span class="font-medium" id="popupValue">--</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-600">Last Update:</span>
                    <span class="text-gray-900" id="popupTime">--</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-600">Status:</span>
                    <span class="font-medium" id="popupStatus">--</span>
                </div>
            </div>
            <button 
                class="w-full mt-3 px-3 py-2 bg-water-blue text-white rounded-lg hover:bg-water-cyan transition-colors text-sm"
                onclick="openLocationDashboard()"
            >
                <i class="fas fa-chart-line mr-2"></i>View Details
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="env-config.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="map.js"></script>
    <script src="data.js"></script>
</body>
</html>
