<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Dashboard - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'water-blue': '#0ea5e9',
                        'water-cyan': '#06b6d4',
                        'water-teal': '#0d9488'
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-cyan-50 to-teal-50">
    <!-- Background Animation -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-water-blue opacity-10 rounded-full animate-pulse"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-water-cyan opacity-10 rounded-full animate-pulse delay-1000"></div>
    </div>

    <div class="relative min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Header -->
            <div class="text-center">
                <div class="mx-auto h-16 w-16 bg-gradient-to-r from-water-blue to-water-cyan rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-tint text-white text-2xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Water Data Dashboard</h2>
                <p class="text-gray-600">Sign in to access real-time water monitoring</p>
            </div>

            <!-- Login Form -->
            <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl p-8 border border-white/20">
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-envelope mr-2 text-water-blue"></i>Email Address
                        </label>
                        <input 
                            id="email" 
                            name="email" 
                            type="email" 
                            required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-water-blue focus:border-transparent transition-all duration-200 bg-white/50"
                            placeholder="Enter your email"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2 text-water-blue"></i>Password
                        </label>
                        <input 
                            id="password" 
                            name="password" 
                            type="password" 
                            required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-water-blue focus:border-transparent transition-all duration-200 bg-white/50"
                            placeholder="Enter your password"
                        >
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input 
                                id="remember-me" 
                                name="remember-me" 
                                type="checkbox" 
                                class="h-4 w-4 text-water-blue focus:ring-water-blue border-gray-300 rounded"
                            >
                            <label for="remember-me" class="ml-2 block text-sm text-gray-700">
                                Remember me
                            </label>
                        </div>
                        <div class="text-sm">
                            <a href="#" class="font-medium text-water-blue hover:text-water-cyan transition-colors">
                                Forgot password?
                            </a>
                        </div>
                    </div>

                    <button 
                        type="submit" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gradient-to-r from-water-blue to-water-cyan hover:from-water-cyan hover:to-water-teal focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-water-blue transition-all duration-200 transform hover:scale-105"
                    >
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Sign In
                    </button>
                </form>

                <!-- Sign Up Link -->
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600">
                        Don't have an account? 
                        <a href="#" id="signupLink" class="font-medium text-water-blue hover:text-water-cyan transition-colors">
                            Sign up here
                        </a>
                    </p>
                </div>

                <!-- Error/Success Messages -->
                <div id="messageContainer" class="mt-4 hidden">
                    <div id="messageContent" class="p-3 rounded-lg text-sm"></div>
                </div>
            </div>

            <!-- Features Preview -->
            <div class="grid grid-cols-3 gap-4 mt-8">
                <div class="text-center">
                    <div class="w-12 h-12 bg-water-blue/10 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-map-marked-alt text-water-blue"></i>
                    </div>
                    <p class="text-xs text-gray-600">Interactive Maps</p>
                </div>
                <div class="text-center">
                    <div class="w-12 h-12 bg-water-cyan/10 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-chart-line text-water-cyan"></i>
                    </div>
                    <p class="text-xs text-gray-600">Real-time Data</p>
                </div>
                <div class="text-center">
                    <div class="w-12 h-12 bg-water-teal/10 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-shield-alt text-water-teal"></i>
                    </div>
                    <p class="text-xs text-gray-600">Secure Access</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="env-config.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
