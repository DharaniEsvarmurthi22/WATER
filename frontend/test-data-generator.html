<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Data Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">🧪 Test Data Generator</h1>
            <p class="text-gray-600 mb-4">Generate realistic sensor data for testing your dashboard</p>
            
            <!-- Configuration -->
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                <h3 class="font-semibold text-blue-900 mb-2">⚙️ Configuration</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Supabase URL</label>
                        <input type="text" id="supabaseUrl" 
                               placeholder="https://xxx.supabase.co"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Anon Key</label>
                        <input type="text" id="supabaseKey" 
                               placeholder="eyJ..."
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    </div>
                </div>
                <button onclick="saveConfig()" 
                        class="mt-3 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
                    💾 Save Configuration
                </button>
            </div>

            <!-- Status -->
            <div id="status" class="mb-6 p-4 rounded-lg bg-gray-50 border border-gray-200">
                <p class="text-sm text-gray-600">Status: <span id="statusText">Not connected</span></p>
            </div>

            <!-- Actions -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="generateSingleReading()" 
                        class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold">
                    ➕ Generate Single Reading
                </button>
                <button onclick="generateBatchReadings()" 
                        class="px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-semibold">
                    📊 Generate 24 Hours of Data
                </button>
            </div>

            <!-- Auto Generate -->
            <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
                <h3 class="font-semibold text-yellow-900 mb-3">🔄 Auto-Generate Data</h3>
                <div class="flex items-center gap-4">
                    <button id="autoBtn" onclick="toggleAutoGenerate()" 
                            class="px-6 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 font-semibold">
                        ▶️ Start Auto-Generate (Every 30s)
                    </button>
                    <span id="autoStatus" class="text-sm text-gray-600">Stopped</span>
                </div>
            </div>

            <!-- Location Selector -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">📍 Test Specific Location</label>
                <div class="flex gap-2">
                    <select id="locationSelect" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg">
                        <option value="all">All Locations</option>
                        <option value="ukkadam">Ukkadam</option>
                        <option value="singanallur">Singanallur</option>
                        <option value="redhills">Red Hills</option>
                        <option value="porur">Porur</option>
                    </select>
                    <button onclick="generateForLocation()" 
                            class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold">
                        Generate
                    </button>
                </div>
            </div>

            <!-- Recent Readings -->
            <div>
                <h3 class="font-semibold text-gray-900 mb-3">📝 Recent Readings</h3>
                <div id="recentReadings" class="space-y-2 max-h-96 overflow-y-auto">
                    <p class="text-sm text-gray-500">No readings yet</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let supabase = null;
        let autoInterval = null;

        // Load saved config
        window.onload = () => {
            const savedUrl = localStorage.getItem('supabase_url');
            const savedKey = localStorage.getItem('supabase_key');
            if (savedUrl) document.getElementById('supabaseUrl').value = savedUrl;
            if (savedKey) document.getElementById('supabaseKey').value = savedKey;
            if (savedUrl && savedKey) {
                initSupabase(savedUrl, savedKey);
            }
        };

        function saveConfig() {
            const url = document.getElementById('supabaseUrl').value;
            const key = document.getElementById('supabaseKey').value;
            
            if (!url || !key) {
                alert('Please enter both URL and Key');
                return;
            }

            localStorage.setItem('supabase_url', url);
            localStorage.setItem('supabase_key', key);
            initSupabase(url, key);
        }

        function initSupabase(url, key) {
            supabase = window.supabase.createClient(url, key);
            updateStatus('✅ Connected', 'green');
            loadRecentReadings();
        }

        function updateStatus(text, color = 'gray') {
            document.getElementById('statusText').textContent = text;
            document.getElementById('status').className = `mb-6 p-4 rounded-lg border bg-${color}-50 border-${color}-200`;
        }

        async function generateSingleReading() {
            if (!supabase) {
                alert('Please configure Supabase first');
                return;
            }

            updateStatus('⏳ Generating data...', 'blue');

            try {
                const sensors = await getSensors();
                const readings = sensors.map(s => ({
                    sensor_id: s.id,
                    location_id: s.location_id,
                    value: generateValue(s.sensor_type),
                    rssi: -40 - Math.floor(Math.random() * 20),
                    device_id: 'TEST_DEVICE'
                }));

                const { error } = await supabase
                    .from('sensor_readings')
                    .insert(readings);

                if (error) throw error;

                updateStatus('✅ Generated readings for all sensors!', 'green');
                loadRecentReadings();
            } catch (error) {
                updateStatus('❌ Error: ' + error.message, 'red');
            }
        }

        async function generateBatchReadings() {
            if (!supabase) {
                alert('Please configure Supabase first');
                return;
            }

            updateStatus('⏳ Generating 24 hours of data...', 'blue');

            try {
                const sensors = await getSensors();
                const readings = [];

                // Generate data for last 24 hours
                for (let hour = 0; hour < 24; hour++) {
                    const timestamp = new Date();
                    timestamp.setHours(timestamp.getHours() - hour);

                    sensors.forEach(s => {
                        readings.push({
                            sensor_id: s.id,
                            location_id: s.location_id,
                            value: generateValue(s.sensor_type),
                            rssi: -40 - Math.floor(Math.random() * 20),
                            timestamp: timestamp.toISOString(),
                            device_id: 'TEST_DEVICE'
                        });
                    });
                }

                const { error } = await supabase
                    .from('sensor_readings')
                    .insert(readings);

                if (error) throw error;

                updateStatus(`✅ Generated ${readings.length} readings!`, 'green');
                loadRecentReadings();
            } catch (error) {
                updateStatus('❌ Error: ' + error.message, 'red');
            }
        }

        async function generateForLocation() {
            const locationId = document.getElementById('locationSelect').value;
            
            if (locationId === 'all') {
                generateSingleReading();
                return;
            }

            try {
                const sensors = await getSensors(locationId);
                const readings = sensors.map(s => ({
                    sensor_id: s.id,
                    location_id: s.location_id,
                    value: generateValue(s.sensor_type),
                    rssi: -40 - Math.floor(Math.random() * 20),
                    device_id: 'TEST_DEVICE'
                }));

                const { error } = await supabase
                    .from('sensor_readings')
                    .insert(readings);

                if (error) throw error;

                updateStatus(`✅ Generated data for ${locationId}!`, 'green');
                loadRecentReadings();
            } catch (error) {
                updateStatus('❌ Error: ' + error.message, 'red');
            }
        }

        function toggleAutoGenerate() {
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                document.getElementById('autoBtn').innerHTML = '▶️ Start Auto-Generate (Every 30s)';
                document.getElementById('autoStatus').textContent = 'Stopped';
            } else {
                autoInterval = setInterval(generateSingleReading, 30000);
                document.getElementById('autoBtn').innerHTML = '⏸️ Stop Auto-Generate';
                document.getElementById('autoStatus').textContent = '🔄 Running...';
                generateSingleReading(); // Generate immediately
            }
        }

        async function getSensors(locationId = null) {
            let query = supabase.from('sensors').select('*');
            if (locationId) {
                query = query.eq('location_id', locationId);
            }
            const { data, error } = await query;
            if (error) throw error;
            return data;
        }

        function generateValue(sensorType) {
            switch(sensorType) {
                case 'pH':
                    return (6.5 + Math.random() * 2).toFixed(2);
                case 'turbidity':
                    return (10 + Math.random() * 30).toFixed(2);
                case 'temperature':
                    return (22 + Math.random() * 8).toFixed(2);
                case 'tds':
                    return (150 + Math.random() * 300).toFixed(2);
                default:
                    return (Math.random() * 100).toFixed(2);
            }
        }

        async function loadRecentReadings() {
            try {
                const { data, error } = await supabase
                    .from('sensor_readings')
                    .select(`
                        *,
                        sensors(sensor_type, unit),
                        locations(name)
                    `)
                    .order('timestamp', { ascending: false })
                    .limit(10);

                if (error) throw error;

                const html = data.map(r => `
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <div class="flex justify-between items-center">
                            <div>
                                <span class="font-semibold">${r.locations.name}</span>
                                <span class="text-gray-600 mx-2">•</span>
                                <span class="text-sm">${r.sensors.sensor_type}: ${r.value} ${r.sensors.unit}</span>
                            </div>
                            <span class="text-xs text-gray-500">${new Date(r.timestamp).toLocaleTimeString()}</span>
                        </div>
                    </div>
                `).join('');

                document.getElementById('recentReadings').innerHTML = html || '<p class="text-sm text-gray-500">No readings yet</p>';
            } catch (error) {
                console.error('Error loading readings:', error);
            }
        }
    </script>
</body>
</html>
