<!DOCTYPE html>
<html>
<head><title>NO SIDEBAR TEST</title></head>
<body style="margin:0; font-family:Arial;">
<div style="display:flex; height:100vh;">
    <!-- LEFT SIDEBAR -->
    <div style="width:280px; background:#f3f4f6; padding:20px; overflow-y:auto;">
        <h2 style="margin:0 0 20px 0;">TEST - NO DEVICE PANEL</h2>
        
        <div style="background:white; padding:15px; border-radius:8px; margin-bottom:20px;">
            <h3 style="margin:0 0 10px 0; font-size:14px;">Upload Files</h3>
            <button style="width:100%; padding:10px; background:#3b82f6; color:white; border:none; border-radius:6px; cursor:pointer;">Choose Files</button>
        </div>
        
        <div style="background:white; padding:15px; border-radius:8px;">
            <h3 style="margin:0 0 10px 0; font-size:14px;">Your Overlays</h3>
            <p style="margin:0; font-size:12px; color:#666;">No overlays yet</p>
        </div>
        
        <!-- NO DEVICE LINKING SECTION HERE -->
        
    </div>
    
    <!-- MAIN CONTENT -->
    <div style="flex:1; background:#1a202c; color:white; display:flex; align-items:center; justify-content:center;">
        <div style="text-align:center;">
            <h1 style="font-size:48px; margin:0 0 20px 0;">✓ SUCCESS</h1>
            <p style="font-size:24px; margin:0;">If you see this, there's NO sidebar device panel</p>
            <p style="font-size:18px; margin:20px 0 0 0; opacity:0.7;">The panel was being created by JavaScript</p>
        </div>
    </div>
</div>
