<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Data Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #4CAF50;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 5px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #45a049;
        }
        pre {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .info { color: #2196F3; }
        .warning { color: #ff9800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Real-time Data Diagnostic Tool</h1>
        
        <div class="section">
            <h2>Connection Status</h2>
            <div id="status">Initializing...</div>
        </div>

        <div class="section">
            <h2>Quick Tests</h2>
            <button onclick="testFetchAll()">📊 Fetch All Sensor Readings</button>
            <button onclick="testFetchKaripatti()">🎯 Fetch Karipatti Data</button>
            <button onclick="testFetchLatest()">⏰ Fetch Latest 10 Readings</button>
            <button onclick="subscribeRealtime()">🔔 Subscribe to Real-time Updates</button>
            <button onclick="clearOutput()">🗑️ Clear Output</button>
        </div>

        <div class="section">
            <h2>Output</h2>
            <pre id="output"></pre>
        </div>
    </div>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://uvqcctheqvuilwfbpqcd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2cWNjdGhlcXZ1aWx3ZmJwcWNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExNDA0NDgsImV4cCI6MjA3NjcxNjQ0OH0.BDPOk3CicghYD18lqRCvITbLyHKLP_mQWtprXrkXphs';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let subscription = null;

        // Update status
        document.getElementById('status').innerHTML = `<span class="success">✅ Connected to Supabase</span>`;

        function log(message, type = 'info') {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }

        async function testFetchAll() {
            log('🔍 Fetching all sensor readings...', 'info');
            try {
                const { data, error } = await supabase
                    .from('sensor_readings')
                    .select('*')
                    .order('timestamp', { ascending: false })
                    .limit(50);

                if (error) throw error;

                log(`✅ Found ${data.length} readings:`, 'success');
                log(JSON.stringify(data, null, 2), 'info');
            } catch (err) {
                log(`❌ Error: ${err.message}`, 'error');
            }
        }

        async function testFetchKaripatti() {
            log('🎯 Fetching Karipatti sensor data...', 'info');
            try {
                const { data, error } = await supabase
                    .from('sensor_readings')
                    .select('*')
                    .like('sensor_id', 'karipatti_%')
                    .order('timestamp', { ascending: false })
                    .limit(20);

                if (error) throw error;

                log(`✅ Found ${data.length} Karipatti readings:`, 'success');
                log(JSON.stringify(data, null, 2), 'info');
            } catch (err) {
                log(`❌ Error: ${err.message}`, 'error');
            }
        }

        async function testFetchLatest() {
            log('⏰ Fetching latest 10 readings...', 'info');
            try {
                const { data, error } = await supabase
                    .from('sensor_readings')
                    .select('*')
                    .order('timestamp', { ascending: false })
                    .limit(10);

                if (error) throw error;

                log(`✅ Latest ${data.length} readings:`, 'success');
                data.forEach(reading => {
                    log(`  📍 ${reading.sensor_id}: ${reading.value} (RSSI: ${reading.rssi}, Time: ${new Date(reading.timestamp).toLocaleString()})`, 'info');
                });
            } catch (err) {
                log(`❌ Error: ${err.message}`, 'error');
            }
        }

        function subscribeRealtime() {
            if (subscription) {
                log('⚠️  Already subscribed to real-time updates', 'warning');
                return;
            }

            log('🔔 Subscribing to real-time sensor_readings updates...', 'info');
            
            subscription = supabase
                .channel('sensor_readings_changes')
                .on(
                    'postgres_changes',
                    {
                        event: '*',
                        schema: 'public',
                        table: 'sensor_readings'
                    },
                    (payload) => {
                        log('🔔 REAL-TIME UPDATE RECEIVED!', 'success');
                        log(`Event: ${payload.eventType}`, 'info');
                        log(`Data: ${JSON.stringify(payload.new, null, 2)}`, 'info');
                        log('---', 'info');
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        log('✅ Successfully subscribed to real-time updates!', 'success');
                        log('Waiting for ESP32 to send new data...', 'info');
                    } else {
                        log(`Subscription status: ${status}`, 'warning');
                    }
                });
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            log('🚀 Diagnostic tool ready!', 'success');
            log('Click buttons above to run tests', 'info');
            log('---', 'info');
        });
    </script>
</body>
</html>
