<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Water Quality Dashboard - Sign In</title>
    <style>
        :root { --bg1: #0ea5a4; --bg2: #06b6d4; --card: #ffffff; --accent: #0ea5a4; --muted: #6b7280; }
        html,body { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: linear-gradient(135deg, var(--bg1), var(--bg2)); display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { width: 100%; max-width: 420px; background: var(--card); border-radius: 16px; box-shadow: 0 10px 30px rgba(2,6,23,0.25); padding: 28px; transition: transform .3s, box-shadow .3s; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(2,6,23,0.32); }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        .logo { width: 52px; height: 52px; border-radius: 10px; background: linear-gradient(135deg,rgba(14,165,164,0.14),rgba(6,182,212,0.14)); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent); font-size: 20px; }
        h1 { margin: 0; font-size: 20px; color: #0f172a; }
        p.lead { margin: 6px 0 18px; color: var(--muted); font-size: 14px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #0f172a; }
        .input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #e6eef2; background: #fff; box-sizing: border-box; transition: border-color .15s, box-shadow .15s; }
        .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 6px 18px rgba(6,182,212,0.12); }
        .row { margin-bottom: 14px; }
        .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
        .btn { appearance: none; border: 0; padding: 12px 16px; border-radius: 10px; background: linear-gradient(90deg,var(--bg1),var(--bg2)); color: white; font-weight: 600; cursor: pointer; transition: transform .2s, box-shadow .2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(6,182,212,0.18); }
        .muted { color: var(--muted); font-size: 13px; }
        .footer { margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); }
        @media (max-width:420px) { .card { padding: 20px; border-radius: 12px; } .logo { width: 44px; height: 44px; font-size: 18px; } }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <div class="logo">WQ</div>
            <div>
                <h1>Water Quality Dashboard</h1>
                <p class="lead">Secure access to real-time monitoring</p>
            </div>
        </div>
        <form id="loginForm" autocomplete="off">
            <div class="row">
                <label for="username">Username</label>
                <input id="username" class="input" type="text" required>
            </div>
            <div class="row">
                <label for="password">Password</label>
                <input id="password" class="input" type="password" required>
            </div>
            <div class="row actions">
                <div></div>
                <button class="btn" type="submit">Sign in</button>
            </div>
        </form>
        <div class="footer">Sign in to access the water monitoring platform.</div>
    </main>
    <script>
        (function(){
            const form = document.getElementById("loginForm");
            form.onsubmit = function(e){
                e.preventDefault();
                const u = document.getElementById("username").value.trim();
                const p = document.getElementById("password").value;
                if(u === "admin" && p === "admin@1234"){
                    localStorage.setItem("isAuthenticated", "true");
                    window.location.href = "index.html";
                    return false;
                }
                alert("Invalid username or password");
                return false;
            };
        })();
    </script>
</body>
</html>
