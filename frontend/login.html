<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quality Dashboard - Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(135deg, #0ea5a4 0%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, rgba(14, 165, 164, 0.15), rgba(6, 182, 212, 0.15));
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #0ea5a4;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #0ea5a4;
            box-shadow: 0 0 0 3px rgba(14, 165, 164, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #0ea5a4 0%, #06b6d4 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .footer-text {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-section">
            <div class="logo">WQ</div>
            <h1>Water Quality Dashboard</h1>
            <p class="subtitle">Secure access to real-time monitoring</p>
        </div>
        <form id="loginForm">
            <div class="error-message" id="errorMessage"></div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="user@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
        </form>
        <p class="footer-text">Sign in to access the water monitoring platform</p>
    </div>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="env-config.js"></script>
    <script>
        let supabase;
        (async function() {
            try {
                if (window.ENV && window.ENV.SUPABASE_URL && window.ENV.SUPABASE_ANON_KEY) {
                    supabase = window.supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY);
                    console.log("Supabase initialized");
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) { window.location.href = "index.html"; }
                } else {
                    showError("Configuration error. Please contact administrator.");
                }
            } catch (error) {
                console.error("Init error:", error);
                showError("System error. Please contact administrator.");
            }
        })();
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideError();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const submitBtn = document.getElementById("submitBtn");
            if (!email || !password) {
                showError("Please enter both email and password");
                return;
            }
            submitBtn.disabled = true;
            submitBtn.textContent = "Signing in...";
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email: email, password: password });
                if (error) {
                    showError("Invalid email or password");
                    return;
                }
                if (data.session) {
                    localStorage.setItem("isAuthenticated", "true");
                    window.location.href = "index.html";
                }
            } catch (error) {
                console.error("Login error:", error);
                showError("Login failed. Please try again.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In";
            }
        });
        function showError(message) {
            const errorEl = document.getElementById("errorMessage");
            errorEl.textContent = message;
            errorEl.classList.add("show");
        }
        function hideError() {
            const errorEl = document.getElementById("errorMessage");
            errorEl.classList.remove("show");
        }
    </script>
</body>
</html>
