<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Dashboard - Water Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'water-blue': '#0ea5e9',
                        'water-cyan': '#06b6d4',
                        'water-teal': '#0d9488'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 location-page">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Back Button and Title -->
                <div class="flex items-center space-x-4">
                    <button id="backToMapBtn"
                        class="flex items-center space-x-2 px-3 py-2 text-sm text-gray-600 hover:text-gray-900 transition-colors">
                        <i class="fas fa-arrow-left"></i>
                        <span>Back to Map</span>
                    </button>
                    <div class="h-6 w-px bg-gray-300"></div>
                    <div class="flex items-center space-x-3">
                        <div
                            class="w-10 h-10 bg-gradient-to-r from-water-blue to-water-cyan rounded-lg flex items-center justify-center">
                            <i class="fas fa-map-marker-alt text-white text-lg"></i>
                        </div>
                        <div>
                            <h1 id="locationTitle" class="text-xl font-bold text-gray-900">Loading...</h1>
                            <p class="text-xs text-gray-500">Sensor Details</p>
                        </div>
                    </div>
                </div>

                <!-- User Info and Logout -->
                <div class="flex items-center space-x-4">
                    <div id="userInfo" class="hidden sm:block"></div>
                    <button id="logoutButton"
                        class="flex items-center space-x-2 px-3 py-2 text-sm text-gray-600 hover:text-gray-900 transition-colors">
                        <i class="fas fa-sign-out-alt"></i>
                        <span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Loading State -->
        <div id="loadingState" class="flex items-center justify-center py-12">
            <div class="text-center">
                <div
                    class="w-12 h-12 border-4 border-water-blue border-t-transparent rounded-full animate-spin mx-auto mb-4">
                </div>
                <p class="text-gray-600">Loading sensor data...</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden">
            <div class="bg-red-50 border border-red-200 rounded-lg p-6 text-center">
                <i class="fas fa-exclamation-triangle text-red-500 text-3xl mb-4"></i>
                <h3 class="text-lg font-semibold text-red-800 mb-2">Sensor Not Found</h3>
                <p class="text-red-600 mb-4">The requested sensor could not be found or you don't have access to it.</p>
                <button onclick="window.location.href='index.html'"
                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                    Return to Dashboard
                </button>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div id="mainDashboard" class="hidden space-y-6">
            <!-- Sensor Selector Tabs -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
                <div class="flex flex-wrap gap-2" id="sensorTabs">
                    <!-- Tabs will be populated by JavaScript -->
                </div>
            </div>

            <!-- All Sensors Overview Grid -->
            <div id="allSensorsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Will be populated with all 4 sensors OR single sensor view -->
            </div>

            <!-- Charts Section for All Sensors View -->
            <div id="allSensorsChartsSection" class="grid grid-cols-1 gap-6">
                <!-- Historical Chart with Time Range -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-lg font-semibold text-gray-900">Historical Trend</h3>
                        <select id="timeRangeSelect"
                            class="px-3 py-1 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-water-blue focus:border-transparent">
                            <option value="24h" selected>Last 24 Hours</option>
                            <option value="7d">Last Week</option>
                            <option value="30d">Last Month</option>
                            <option value="90d">Last 3 Months</option>
                            <option value="180d">Last 6 Months</option>
                            <option value="365d">Last Year</option>
                            <option value="all">Complete Data (All Time)</option>
                        </select>
                    </div>
                    <div class="h-64">
                        <canvas id="historicalChart"></canvas>
                    </div>
                </div>
                
                <!-- Recent Readings Table -->
                <div id="recentReadingsTable">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>

            <!-- Charts Section for Single Sensor View -->
            <div id="singleSensorChartsSection" class="hidden grid grid-cols-1 gap-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-lg font-semibold text-gray-900">Historical Trend</h3>
                        <select id="singleSensorTimeRange"
                            class="px-3 py-1 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-water-blue focus:border-transparent">
                            <option value="24h" selected>Last 24 Hours</option>
                            <option value="7d">Last Week</option>
                            <option value="30d">Last Month</option>
                            <option value="90d">Last 3 Months</option>
                            <option value="180d">Last 6 Months</option>
                            <option value="365d">Last Year</option>
                            <option value="all">Complete Data (All Time)</option>
                        </select>
                    </div>
                    <div style="height: 400px;">
                        <canvas id="singleSensorChart"></canvas>
                    </div>
                        <!-- Single sensor readings table + export (appears under the single sensor chart) -->
                        <div id="singleRecentReadingsTable" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="env-config.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="location.js"></script>
</body>

</html>
